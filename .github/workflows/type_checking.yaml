name: Type Checking

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**/*.py"
      - "mypy.ini"
      - ".github/workflows/type_checking.yaml"

  pull_request:
    branches: [ '**' ]
    paths:
      - "src/**/*.py"
      - "mypy.ini"
      - ".github/workflows/type_checking.yaml"

jobs:
  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-PyYAML types-tqdm
        # Install package dependencies (without optional dependencies that may fail)
        pip install torch pyyaml "numpy<2" packaging safetensors dacite tqdm datasets torchtyping

    - name: Run mypy type checker
      run: |
        python -m mypy src/nanotron --show-error-codes --pretty
      continue-on-error: true

    - name: Generate type checking report
      if: always()
      run: |
        echo "### Type Checking Summary" >> $GITHUB_STEP_SUMMARY
        python -m mypy src/nanotron --show-error-codes 2>&1 | tee mypy-report.txt
        ERROR_COUNT=$(grep -c "error:" mypy-report.txt || echo "0")
        echo "Total type errors: $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "#### Sample Errors (first 20):" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        head -20 mypy-report.txt >> $GITHUB_STEP_SUMMARY || true
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Upload mypy report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: mypy-report
        path: mypy-report.txt
