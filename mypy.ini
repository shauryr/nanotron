[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
show_error_codes = True
show_column_numbers = True
pretty = True

# Start with incremental strictness - can be made stricter over time
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_subclassing_any = False

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = False

# Per-module options for third-party libraries
[mypy-torch.*]
ignore_missing_imports = True

[mypy-datasets.*]
ignore_missing_imports = True

[mypy-transformers.*]
ignore_missing_imports = True

[mypy-safetensors.*]
ignore_missing_imports = True

[mypy-dacite.*]
ignore_missing_imports = True

[mypy-torchtyping.*]
ignore_missing_imports = True

[mypy-flash_attn.*]
ignore_missing_imports = True

[mypy-datatrove.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-s3fs.*]
ignore_missing_imports = True

[mypy-packaging.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

[mypy-fsspec.*]
ignore_missing_imports = True

# Nanotron specific modules - enforce stricter checking as we add annotations
[mypy-nanotron.config.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True

[mypy-nanotron.helpers]
disallow_untyped_defs = True
disallow_incomplete_defs = True
